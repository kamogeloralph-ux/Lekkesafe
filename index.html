<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LekkeSafe — Find your community</title>
<meta name="theme-color" content="#0c1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230c1220%22/><rect x=%2235%22 y=%2235%22 width=%2230%22 height=%2230%22 fill=%22%23f2a93b%22 transform=%22rotate(45 50 50)%22/></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">

  <div class="wordmark"><span class="lekke">Lekke</span><span class="safe">Safe</span></div>

  <h1>Which community are you in?</h1>
  <p>Find your neighbourhood to see tonight's patrollers, report an incident, or check in for a shift.</p>

  <div class="search-field">
    <input type="text" id="community-search" placeholder="Search by suburb or ward…" autocomplete="off">
  </div>

  <div id="status" class="status-msg" style="display:none;"></div>

  <div class="community-list" id="community-list">
    <!-- populated by js/app.js -->
  </div>

  <footer class="legal">
    Community not listed? <a href="#" id="request-community-link">Ask your CPF leader to add it</a>.
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
  LekkeSafe.loadCommunityList();
</script>
</body>
</html>
