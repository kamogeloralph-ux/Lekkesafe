<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LekkeSafe — Offline</title>
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <div class="wordmark"><span class="lekke">Lekke</span><span class="safe">Safe</span></div>
  <div class="plaque">
    <div class="plaque-label">No connection</div>
    <h1>You're offline</h1>
    <p>LekkeSafe needs a connection to report incidents or reach patrollers. Reconnect and try again.</p>
    <p><strong>In a real emergency, call 10111 (SAPS) directly.</strong></p>
  </div>
  <button class="btn btn-primary" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
